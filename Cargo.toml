[package]
name = "near-intents-tools"
version = "0.1.0"
edition = "2021"
description = "Tools for monitoring and interacting with NEAR Intents protocol"
license = "MIT"
repository = "https://github.com/dannywillems/near-intents-tools"

[dependencies]
chrono = "0.4.44"
futures-util = "0.3.31"
reqwest = { version = "0.13.1", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.20.0", features = ["v4"] }
